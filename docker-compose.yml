services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["dev", "prod", "test"]

  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2g
    profiles: [dev, prod, test]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["dev", "prod", "test"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MODE: ${MODE}
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT}
      DEBUG: ${DEBUG}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      SECRET_KEY: ${SECRET_KEY}
      SELENIUM_URL: http://selenium:4444/wd/hub
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      selenium:
        condition: service_started
      ollama:
        condition: service_started
    profiles: ["dev", "prod"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_URL: ${API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    profiles: ["dev"]

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api/
    environment:
      NEXT_PUBLIC_API_URL: /api/
    depends_on:
      - backend
    profiles: ["prod"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    profiles: ["dev"]

  nginx-prod:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend-prod
    profiles: ["prod"]

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.dev
    environment:
      MODE: test
      DJANGO_ENVIRONMENT: test
      DEBUG: "False"
      SECRET_KEY: test-secret-key
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      SELENIUM_URL: http://selenium:4444/wd/hub
      OLLAMA_URL: http://ollama:11434
    command: python manage.py test --parallel
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      selenium:
        condition: service_started
      ollama:
        condition: service_started
    profiles: ["test"]

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm test
    volumes:
      - ./frontend:/app
    profiles: ["test"]

volumes:
  postgres_data:
  frontend_build:
  ollama_data:
